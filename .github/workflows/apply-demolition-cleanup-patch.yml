name: Apply demolition cleanup patch

on:
  push:
    branches:
      - fix/demolition-full-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/demolition-full-cleanup
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply focused demolition changes
        run: |
          python3 scripts/_apply_demolition_cleanup_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/hytale/prefabs-building.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          git diff --check
          ./gradlew test

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/dev/civilizations/hytale/BuildingPlacementRegistry.java \
            src/main/java/dev/civilizations/hytale/ConstructionWorkSystem.java \
            src/main/java/dev/civilizations/hytale/RtsInteractionController.java \
            src/test/java/dev/civilizations/hytale/BuildingPlacementRegistryTest.java \
            src/test/java/dev/civilizations/hytale/DemolitionLifecycleContractTest.java \
            docs/hytale/prefabs-building.md
          git diff --cached --quiet && { echo "Expected patch produced no changes"; exit 1; }
          git commit -m "Fully clean demolished building state"
          git push origin HEAD:fix/demolition-full-cleanup
