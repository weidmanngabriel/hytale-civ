name: Simulation Recordings

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'asset-pack/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - 'web-viewer/**'
      - 'scripts/collect-simulation-recordings.mjs'
      - '.github/workflows/simulation-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-recordings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Run Java tests
        id: tests
        continue-on-error: true
        run: ./gradlew test --stacktrace
      - name: Export scenarios (also after test failure)
        id: export
        if: always() && !cancelled()
        continue-on-error: true
        env:
          SIM_VIEWER_COMMIT: ${{ github.sha }}
          SIM_VIEWER_BRANCH: ${{ github.ref_name }}
        run: ./gradlew exportSimulationRecordings --stacktrace
      - name: Record test outcome
        if: always() && !cancelled()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          mkdir -p build/simulation-recordings
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('build/simulation-recordings/ci-status.json').write_text(json.dumps({
            'testStatus': 'passed' if os.environ['TEST_OUTCOME'] == 'success' else 'failed',
            'exportStatus': os.environ['EXPORT_OUTCOME']
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: simulation-recordings
          path: build/simulation-recordings/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Keep failures visible in Actions
        if: steps.tests.outcome != 'success' || steps.export.outcome != 'success'
        run: exit 1
