name: Temporary Miner Layer 4 Docs Patch

on:
  push:
    branches:
      - agent/miner-work-front-v1

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/miner-work-front-v1
          fetch-depth: 0
      - name: Patch maintained docs
        run: python3 scripts/tmp-doc-patch.py
      - name: Commit patched docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No documentation changes needed"
            exit 0
          fi
          git commit -m "Document miner work-front execution"
          git push origin HEAD:agent/miner-work-front-v1
