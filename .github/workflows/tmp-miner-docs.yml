name: Temporary miner docs update

on:
  push:
    branches:
      - feature/miner-resume-variable-tunnels
    paths:
      - .github/workflows/tmp-miner-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/miner-resume-variable-tunnels
      - name: Append miner architecture notes
        run: |
          if ! grep -q "Variable mine segments and manual exit" docs/architecture.md; then
            cat >> docs/architecture.md <<'EOF'

          ## Variable mine segments and manual exit

          `MineSegment` owns its persisted `lengthBlocks`; production segments use a 4x4 cross-section and 4-12 blocks of length. Geometry, progress, collision checks, work fronts and support cadence derive from the segment itself rather than a global length. Legacy persisted segments without the field decode as the former 8-block reference length.

          `MinerWorkSystem` chooses a desired length and shortens the candidate before rejecting a direction when building or tunnel bounds block it. After a player interrupts a miner, Civ may resume another unfinished front or create a fresh valid branch; the exact interrupted front is only the fallback when no alternative exists.

          Manual movement remains a Core `MovementIntent`. When the assigned miner is below its mine access, the Hytale adapter adds the native `Teleport` ECS component to move it to `workplace_access`, keeps the original manual intent active, and lets native `ReadPosition`/`Seek` handle the clicked destination from there. This is an Hytale boundary behavior, not custom pathfinding.
          EOF
          fi
          if ! grep -q "Flexible Minenstollen" docs/concept.md; then
            cat >> docs/concept.md <<'EOF'

          ## Flexible Minenstollen

          Minenabbauer graben 4x4-Stollen in variablen Abschnitten von 4 bis 12 Blöcken. Passt die zunächst gewählte Länge wegen eines Gebäudes oder vorhandenen Stollens nicht, wird derselbe Verlauf zunächst kürzer geplant, bevor eine andere Richtung gewählt wird. Kurven benötigen wegen ihres gemeinsamen 4x4x4-Übergangs mindestens 5 Blöcke.

          Ein Spieler kann einen unterirdischen Minenabbauer jederzeit manuell herausrufen: Ein normaler Bewegungsbefehl setzt ihn am `workplace_access` seiner Mine ab, danach läuft er zum angeklickten Ziel. Nimmt er später die Arbeit wieder auf, darf er sich eine andere offene Arbeitsfront oder einen neuen gültigen Tunnelast suchen und muss nicht exakt zum unterbrochenen Block zurückkehren.
          EOF
          fi
          if ! grep -q "Manueller Miner-Ausgang" docs/hytale/npc-navigation.md; then
            cat >> docs/hytale/npc-navigation.md <<'EOF'

          ## Manueller Miner-Ausgang

          Ein manueller Bewegungsbefehl für einen unterirdischen Minenabbauer verwendet Hytales native `Teleport`-ECS-Komponente, um den NPC zum `workplace_access` seiner zugewiesenen Mine zu setzen. Der bestehende `MovementIntent` wird nicht abgeschlossen; anschließend übernimmt wieder das normale native `ReadPosition`/`Seek` zum vom Spieler geklickten Ziel. Die gepinnte Server-JAR bestätigt die `Teleport(Vector3dc, Rotation3fc)`-Komponente und den NPC-Teleport-Lifecycle. Ob die konkrete Runtime-Positionierung im Spiel wie beabsichtigt wirkt, bleibt ein Ingame-Test.
          EOF
          fi
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/concept.md docs/hytale/npc-navigation.md
          git commit -m "Document flexible miner routing and tunnel lengths"
          git push origin HEAD:feature/miner-resume-variable-tunnels
