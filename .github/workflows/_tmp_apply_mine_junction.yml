name: Apply mine junction core patch

on:
  push:
    branches:
      - feature/mine-junction-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mine-junction-core
          fetch-depth: 0

      - name: Apply mine junction adapter changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/java/dev/civilizations/hytale/MinerWorkSystem.java')
          text = path.read_text()

          # Keep the authored connector gate, but normalize the indentation left by the previous patch.
          old_connector = '''        if (!runtime.reachedConnector) {
    Vector3d target = center(connector.bounds(), connector.bounds().minY());
    if (!arrived(position, target)) {
        navigateTo(ref, position, target, runtime);
        stopMiningAnimation(ref, store, runtime);
        return;
    }
    runtime.reachedConnector = true;
    runtime.navigationArrived();
}
'''
          new_connector = '''        if (!runtime.reachedConnector) {
            Vector3d target = center(connector.bounds(), connector.bounds().minY());
            if (!arrived(position, target)) {
                navigateTo(ref, position, target, runtime);
                stopMiningAnimation(ref, store, runtime);
                return;
            }
            runtime.reachedConnector = true;
            runtime.navigationArrived();
        }
'''
          if old_connector in text:
              text = text.replace(old_connector, new_connector, 1)

          # The parent now excavates its own 4x4x4 junction completely. Child segments therefore
          # never need a synthetic shared-junction staging target.
          text, count = re.subn(
              r'\n        if \(isTurnSegment\(worldId, segment\).*?\n\}\n\n        Vector3d workTarget = workTarget\(segment\);',
              '\n        Vector3d workTarget = workTarget(segment);',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'turn staging block count={count}')

          old_depth = 'int depth = Math.min(segment.lengthBlocks() - 1, segment.nextBlockIndex() / faceSize);'
          new_depth = 'int depth = Math.min(segment.totalDepthBlocks() - 1, segment.nextBlockIndex() / faceSize);'
          if old_depth not in text:
              raise SystemExit('workTarget depth anchor not found')
          text = text.replace(old_depth, new_depth, 1)

          old_end_support = 'if (oneBasedDepth >= segment.lengthBlocks()) return false;'
          new_end_support = 'if (oneBasedDepth > segment.lengthBlocks()) return false;'
          if old_end_support not in text:
              raise SystemExit('support end anchor not found')
          text = text.replace(old_end_support, new_end_support, 1)

          # Turns no longer need a five-block minimum: every candidate reserves its own separate
          # four-block junction, so all main tunnels may use the same 4..12 range.
          text, count = re.subn(
              r'        int minimum = MineTuning\.MIN_SEGMENT_LENGTH_BLOCKS;\n'
              r'        if \(parent != null && direction != parent\.direction\(\)\) \{.*?\n        \}\n'
              r'        int desired = Math\.max\(minimum, randomSegmentLength\(\)\);',
              '        int minimum = MineTuning.MIN_SEGMENT_LENGTH_BLOCKS;\n'
              '        int desired = Math.max(minimum, randomSegmentLength());',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'fittingCandidate minimum block count={count}')

          # Remove the obsolete shared-junction helpers.
          text, count = re.subn(
              r'\n    private boolean isTurnSegment\(UUID worldId, MineSegment segment\) \{.*?\n    private static Vector3d workTarget\(MineSegment segment\) \{',
              '\n    private static Vector3d workTarget(MineSegment segment) {',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'obsolete junction helpers count={count}')

          text = text.replace('        private UUID turnStagedSegmentId;\n', '')
          text = text.replace('            turnStagedSegmentId = null;\n', '')

          path.write_text(text)
          PY

      - name: Commit adapter patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/civilizations/hytale/MinerWorkSystem.java
          git commit -m "Excavate fixed junctions before tunnel continuation"
          git push origin HEAD:feature/mine-junction-core
