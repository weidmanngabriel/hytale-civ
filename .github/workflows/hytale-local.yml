name: Hytale Local Runtime Probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/headless-server-spike
    paths:
      - .github/workflows/hytale-local.yml
      - asset-pack/manifest.json

permissions:
  contents: read

jobs:
  local-runtime-probe:
    name: Verify local Hytale runtime
    runs-on: [self-hosted, Windows, X64, hytale-local]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:HYTALE_SERVER_JAR)) {
            throw 'HYTALE_SERVER_JAR is not available to the runner process.'
          }
          if ([string]::IsNullOrWhiteSpace($env:HYTALE_ASSETS_PATH)) {
            throw 'HYTALE_ASSETS_PATH is not available to the runner process.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_SERVER_JAR -PathType Leaf)) {
            throw 'HYTALE_SERVER_JAR does not point to an existing file.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_ASSETS_PATH -PathType Leaf)) {
            throw 'HYTALE_ASSETS_PATH does not point to an existing file.'
          }

          Write-Host 'Hytale server JAR: OK'
          Write-Host 'Hytale Assets.zip: OK'

      - name: Verify Java 25
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $javacVersion = (& javac -version | Out-String).Trim()
          Write-Host $javacVersion

          if ($LASTEXITCODE -ne 0) {
            throw 'javac -version failed.'
          }
          if (-not $javacVersion.StartsWith('javac 25')) {
            throw 'The self-hosted runner must expose Java 25 on PATH for the Hytale runtime test.'
          }

      - name: Build Civ plugin
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat jar --no-daemon
          if ($LASTEXITCODE -ne 0) {
            throw 'Gradle jar build failed.'
          }

      - name: Prepare isolated Hytale runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $runtimeDir = Join-Path $PWD 'build\hytale-local-runtime'
          $modsDir = Join-Path $runtimeDir 'mods'

          if (Test-Path -LiteralPath $runtimeDir) {
            Remove-Item -LiteralPath $runtimeDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $modsDir -Force | Out-Null

          $pluginJar = Get-ChildItem -Path 'build\libs' -Filter 'hytale-civ-*.jar' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $pluginJar) {
            throw 'Built Civ plugin JAR was not found in build\libs.'
          }

          Copy-Item -LiteralPath $pluginJar.FullName -Destination $modsDir -Force
          Copy-Item -LiteralPath 'asset-pack' -Destination (Join-Path $modsDir 'hytale-civ-assets') -Recurse -Force

          Write-Host 'Isolated runtime prepared.'
          Write-Host 'Civ plugin and asset pack installed into runtime mods directory.'

      - name: Start real Hytale server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $runtimeDir = Join-Path $PWD 'build\hytale-local-runtime'
          $stdoutLog = Join-Path $runtimeDir 'server.stdout.log'
          $stderrLog = Join-Path $runtimeDir 'server.stderr.log'

          $process = Start-Process -FilePath 'java' `
            -ArgumentList @(
              '-jar',
              $env:HYTALE_SERVER_JAR,
              '--assets', $env:HYTALE_ASSETS_PATH,
              '--auth-mode', 'offline',
              '--disable-sentry',
              '--boot-command', 'stop'
            ) `
            -WorkingDirectory $runtimeDir `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -Wait `
            -PassThru

          $stdout = if (Test-Path -LiteralPath $stdoutLog) { Get-Content -LiteralPath $stdoutLog -Raw } else { '' }
          $stderr = if (Test-Path -LiteralPath $stderrLog) { Get-Content -LiteralPath $stderrLog -Raw } else { '' }
          $combined = $stdout + [Environment]::NewLine + $stderr

          Write-Host '----- Hytale server output -----'
          Write-Host $combined
          Write-Host '----- end Hytale server output -----'
          Write-Host "Hytale server exit code: $($process.ExitCode)"

          if ($combined.Contains('client.disconnection.shutdownReason.missingAssets.failedToLoad')) {
            throw 'Hytale still reports missing assets while using --assets with the local Assets.zip.'
          }
          if ($combined.Contains("Plugin 'Civilizations:HytaleCivAssets' does not specify a target server version")) {
            throw 'Civ asset pack is missing its target Hytale server version.'
          }

          $requiredEvidence = @(
            'Loaded pack: Hytale:Hytale from Assets.zip',
            'Loaded pack: Civilizations:HytaleCivAssets from hytale-civ-assets',
            'Enabled plugin Civilizations:HytaleCiv',
            "Added world 'default'",
            'Universe ready!',
            'Hytale Server Booted!',
            'Console executed command: stop',
            'Shut down plugin Civilizations:HytaleCiv',
            'Shutdown completed!'
          )

          foreach ($evidence in $requiredEvidence) {
            if (-not $combined.Contains($evidence)) {
              throw "Expected Hytale runtime evidence was not found: $evidence"
            }
          }

          if ($process.ExitCode -ne 0) {
            throw "Hytale server exited with code $($process.ExitCode)."
          }

          Write-Host 'Real Hytale server loaded licensed base assets, loaded Civ assets, enabled Civ, reached a ready default universe, and shut down cleanly.'
