name: Hytale Local Runtime Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize Hytale runtime request
    if: github.event.issue.number == 126
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      requested_by: ${{ steps.gate.outputs.requested_by }}
      scenarios: ${{ steps.gate.outputs.scenarios }}

    steps:
      - name: Validate runtime request
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('authorized', 'false');

            const requestIssue = 126;
            const allowedActors = new Set(['weidmanngabriel']);
            const commandPattern = /^\/hytale-test\s+([a-z0-9]+(?:-[a-z0-9]+)*)\s+([0-9a-f]{7,40})$/;
            const scenarioNamePattern = /^[a-z][a-z0-9]{0,31}$/;

            if (context.payload.issue?.number !== requestIssue) {
              console.log('Ignoring comment outside the dedicated Hytale runtime request issue.');
              return;
            }

            const actor = context.actor;
            const commentAuthor = context.payload.comment?.user?.login;
            const sender = context.payload.sender?.login;
            if (!allowedActors.has(actor) || !allowedActors.has(commentAuthor) || !allowedActors.has(sender)) {
              core.setFailed('Runtime tests may only be requested by an explicitly authorized actor.');
              return;
            }

            const body = (context.payload.comment?.body ?? '').trim();
            const match = body.match(commandPattern);
            if (!match) {
              console.log('Ignoring comment because it is not a valid /hytale-test command.');
              return;
            }

            const scenarioPart = match[1];
            const requestedRef = match[2].toLowerCase();
            const { owner, repo } = context.repo;

            let targetCommit;
            try {
              const response = await github.rest.repos.getCommit({ owner, repo, ref: requestedRef });
              targetCommit = response.data;
            } catch (error) {
              core.setFailed(`Could not resolve requested commit ${requestedRef}: ${error.message}`);
              return;
            }

            const headSha = (targetCommit.sha ?? '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(headSha) || !headSha.startsWith(requestedRef)) {
              core.setFailed(`Requested commit ${requestedRef} did not resolve to a matching exact repository SHA.`);
              return;
            }

            const registryResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'scripts/hytale-runtime-scenarios.json',
              ref: headSha,
            });
            if (Array.isArray(registryResponse.data) || !registryResponse.data.content) {
              core.setFailed('Runtime scenario registry is missing or is not a file in the requested commit.');
              return;
            }

            let registry;
            try {
              const decoded = Buffer.from(registryResponse.data.content, 'base64').toString('utf8');
              registry = JSON.parse(decoded);
            } catch (error) {
              core.setFailed(`Runtime scenario registry is not valid JSON: ${error.message}`);
              return;
            }

            if (registry?.version !== 1 || !Array.isArray(registry?.scenarios) || registry.scenarios.length === 0) {
              core.setFailed('Runtime scenario registry has an unsupported shape.');
              return;
            }

            const registered = [];
            for (const scenario of registry.scenarios) {
              if (typeof scenario !== 'string' || !scenarioNamePattern.test(scenario) || scenario === 'all') {
                core.setFailed(`Runtime scenario registry contains an invalid name: ${String(scenario)}.`);
                return;
              }
              if (registered.includes(scenario)) {
                core.setFailed(`Runtime scenario registry contains a duplicate: ${scenario}.`);
                return;
              }
              registered.push(scenario);
            }

            let selected;
            if (scenarioPart === 'all') {
              selected = registered;
            } else {
              const requested = scenarioPart.split('-');
              if (requested.length > 8) {
                core.setFailed('At most 8 explicit runtime scenarios may be requested; use all for larger suites.');
                return;
              }
              if (new Set(requested).size !== requested.length) {
                core.setFailed('Runtime scenario list contains duplicates.');
                return;
              }
              const unknown = requested.filter(scenario => !registered.includes(scenario));
              if (unknown.length > 0) {
                core.setFailed(`Unknown runtime scenario(s): ${unknown.join(', ')}. Registered: ${registered.join(', ')}.`);
                return;
              }
              selected = requested;
            }

            core.setOutput('authorized', 'true');
            core.setOutput('head_sha', headSha);
            core.setOutput('requested_by', actor);
            core.setOutput('scenarios', selected.join(','));

            console.log('Authorized Hytale runtime request');
            console.log(`Request issue: #${requestIssue}`);
            console.log(`Commit: ${headSha}`);
            console.log(`Requested by: ${actor}`);
            console.log(`Scenarios: ${selected.join(', ')}`);

  local-runtime-probe:
    name: Verify local Hytale gameplay runtime
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Windows, X64, hytale-local]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify authorized revision and request
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.head_sha }}
          REQUESTED_BY: ${{ needs.authorize.outputs.requested_by }}
          REQUESTED_SCENARIOS: ${{ needs.authorize.outputs.scenarios }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_SHA) {
            throw "Checked out $actualSha but authorized SHA is $($env:EXPECTED_SHA)."
          }
          Write-Host 'Hytale Runtime Test'
          Write-Host "Commit: $actualSha"
          Write-Host "Requested by: $($env:REQUESTED_BY)"
          Write-Host "Scenarios: $($env:REQUESTED_SCENARIOS)"

      - name: Verify runner environment and select Java 25
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:HYTALE_SERVER_JAR)) {
            throw 'HYTALE_SERVER_JAR is not available to the runner process.'
          }
          if ([string]::IsNullOrWhiteSpace($env:HYTALE_ASSETS_PATH)) {
            throw 'HYTALE_ASSETS_PATH is not available to the runner process.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_SERVER_JAR -PathType Leaf)) {
            throw 'HYTALE_SERVER_JAR does not point to an existing file.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_ASSETS_PATH -PathType Leaf)) {
            throw 'HYTALE_ASSETS_PATH does not point to an existing file.'
          }

          $roots = @(
            'C:\Program Files\Eclipse Adoptium',
            'C:\Program Files\Java',
            'C:\Program Files\Microsoft',
            (Join-Path $env:LOCALAPPDATA 'Programs\Eclipse Adoptium')
          )
          $candidates = @()
          foreach ($root in $roots) {
            if (-not [string]::IsNullOrWhiteSpace($root) -and (Test-Path -LiteralPath $root -PathType Container)) {
              $candidates += Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '^jdk-?25(?:[.\-_].*)?$' }
            }
          }

          $jdk25 = $candidates |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'bin\javac.exe') -PathType Leaf } |
            Sort-Object FullName |
            Select-Object -Last 1

          if ($null -eq $jdk25) {
            throw 'Java 25 installation was not found in the supported local runner locations.'
          }

          $java25Home = $jdk25.FullName
          $java25Bin = Join-Path $java25Home 'bin'
          $javac25 = Join-Path $java25Bin 'javac.exe'
          $javacVersion = (& $javac25 -version 2>&1 | Out-String).Trim()
          Write-Host "Selected Java home: $java25Home"
          Write-Host $javacVersion
          if (-not $javacVersion.StartsWith('javac 25')) {
            throw "Selected Java installation is not Java 25: $javacVersion"
          }

          "JAVA_HOME=$java25Home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $java25Bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host 'Hytale server JAR: OK'
          Write-Host 'Hytale Assets.zip: OK'

      - name: Run tests and build Civ plugin
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat test jar --no-daemon
          if ($LASTEXITCODE -ne 0) {
            throw 'Gradle tests or jar build failed.'
          }

      - name: Run selected Hytale scenarios
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          REQUESTED_SCENARIOS: ${{ needs.authorize.outputs.scenarios }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scenarios = $env:REQUESTED_SCENARIOS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($scenarios.Count -eq 0) {
            throw 'Authorized runtime scenario list is empty.'
          }
          .\scripts\hytale-runtime-tests.ps1 -Scenarios $scenarios
