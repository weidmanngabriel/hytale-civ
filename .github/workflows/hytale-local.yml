name: Hytale Local Runtime Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  authorize:
    name: Authorize Hytale runtime request
    if: github.event.issue.number == 126
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      requested_by: ${{ steps.gate.outputs.requested_by }}
      scenarios: ${{ steps.gate.outputs.scenarios }}
      artifact_available: ${{ steps.gate.outputs.artifact_available }}
      artifact_name: ${{ steps.gate.outputs.artifact_name }}
      artifact_run_id: ${{ steps.gate.outputs.artifact_run_id }}

    steps:
      - name: Validate runtime request
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('authorized', 'false');
            core.setOutput('artifact_available', 'false');
            core.setOutput('artifact_name', '');
            core.setOutput('artifact_run_id', '');

            const requestIssue = 126;
            const allowedActors = new Set(['weidmanngabriel']);
            const commandPattern = /^\/hytale-test\s+([a-z0-9]+(?:-[a-z0-9]+)*)\s+([0-9a-f]{7,40})$/;
            const scenarioNamePattern = /^[a-z][a-z0-9]{0,31}$/;

            if (context.payload.issue?.number !== requestIssue) {
              console.log('Ignoring comment outside the dedicated Hytale runtime request issue.');
              return;
            }

            const actor = context.actor;
            const commentAuthor = context.payload.comment?.user?.login;
            const sender = context.payload.sender?.login;
            if (!allowedActors.has(actor) || !allowedActors.has(commentAuthor) || !allowedActors.has(sender)) {
              core.setFailed('Runtime tests may only be requested by an explicitly authorized actor.');
              return;
            }

            const body = (context.payload.comment?.body ?? '').trim();
            const match = body.match(commandPattern);
            if (!match) {
              console.log('Ignoring comment because it is not a valid /hytale-test command.');
              return;
            }

            const scenarioPart = match[1];
            const requestedRef = match[2].toLowerCase();
            const { owner, repo } = context.repo;

            let targetCommit;
            try {
              const response = await github.rest.repos.getCommit({ owner, repo, ref: requestedRef });
              targetCommit = response.data;
            } catch (error) {
              core.setFailed(`Could not resolve requested commit ${requestedRef}: ${error.message}`);
              return;
            }

            const headSha = (targetCommit.sha ?? '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(headSha) || !headSha.startsWith(requestedRef)) {
              core.setFailed(`Requested commit ${requestedRef} did not resolve to a matching exact repository SHA.`);
              return;
            }

            const registryResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'scripts/hytale-runtime-scenarios.json',
              ref: headSha,
            });
            if (Array.isArray(registryResponse.data) || !registryResponse.data.content) {
              core.setFailed('Runtime scenario registry is missing or is not a file in the requested commit.');
              return;
            }

            let registry;
            try {
              const decoded = Buffer.from(registryResponse.data.content, 'base64').toString('utf8');
              registry = JSON.parse(decoded);
            } catch (error) {
              core.setFailed(`Runtime scenario registry is not valid JSON: ${error.message}`);
              return;
            }

            if (registry?.version !== 1 || !Array.isArray(registry?.scenarios) || registry.scenarios.length === 0) {
              core.setFailed('Runtime scenario registry has an unsupported shape.');
              return;
            }

            const registered = [];
            for (const scenario of registry.scenarios) {
              if (typeof scenario !== 'string' || !scenarioNamePattern.test(scenario) || scenario === 'all') {
                core.setFailed(`Runtime scenario registry contains an invalid name: ${String(scenario)}.`);
                return;
              }
              if (registered.includes(scenario)) {
                core.setFailed(`Runtime scenario registry contains a duplicate: ${scenario}.`);
                return;
              }
              registered.push(scenario);
            }

            let selected;
            if (scenarioPart === 'all') {
              selected = registered;
            } else {
              const requested = scenarioPart.split('-');
              if (requested.length > 8) {
                core.setFailed('At most 8 explicit runtime scenarios may be requested; use all for larger suites.');
                return;
              }
              if (new Set(requested).size !== requested.length) {
                core.setFailed('Runtime scenario list contains duplicates.');
                return;
              }
              const unknown = requested.filter(scenario => !registered.includes(scenario));
              if (unknown.length > 0) {
                core.setFailed(`Unknown runtime scenario(s): ${unknown.join(', ')}. Registered: ${registered.join(', ')}.`);
                return;
              }
              selected = requested;
            }

            const artifactName = `hytale-runtime-plugin-${headSha}`;
            let artifactRunId = '';
            try {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'ci.yml',
                head_sha: headSha,
                status: 'completed',
                per_page: 100,
              });

              const successfulRuns = runs
                .filter(run => run.conclusion === 'success')
                .sort((left, right) => right.run_number - left.run_number);

              for (const run of successfulRuns) {
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const matchingArtifact = artifacts.find(artifact => artifact.name === artifactName && !artifact.expired);
                if (matchingArtifact) {
                  artifactRunId = String(run.id);
                  break;
                }
              }
            } catch (error) {
              core.warning(`Could not inspect CI artifacts for ${headSha}; local Gradle fallback will be used: ${error.message}`);
            }

            core.setOutput('authorized', 'true');
            core.setOutput('head_sha', headSha);
            core.setOutput('requested_by', actor);
            core.setOutput('scenarios', selected.join(','));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('artifact_run_id', artifactRunId);
            core.setOutput('artifact_available', artifactRunId ? 'true' : 'false');

            console.log('Authorized Hytale runtime request');
            console.log(`Request issue: #${requestIssue}`);
            console.log(`Commit: ${headSha}`);
            console.log(`Requested by: ${actor}`);
            console.log(`Scenarios: ${selected.join(', ')}`);
            console.log(artifactRunId
              ? `Using tested CI artifact ${artifactName} from workflow run ${artifactRunId}.`
              : `No successful CI artifact found for ${headSha}; local Gradle fallback will run.`);

  local-runtime-probe:
    name: Verify local Hytale gameplay runtime
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Windows, X64, hytale-local]
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify authorized revision and request
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.head_sha }}
          REQUESTED_BY: ${{ needs.authorize.outputs.requested_by }}
          REQUESTED_SCENARIOS: ${{ needs.authorize.outputs.scenarios }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_SHA) {
            throw "Checked out $actualSha but authorized SHA is $($env:EXPECTED_SHA)."
          }
          Write-Host 'Hytale Runtime Test'
          Write-Host "Commit: $actualSha"
          Write-Host "Requested by: $($env:REQUESTED_BY)"
          Write-Host "Scenarios: $($env:REQUESTED_SCENARIOS)"

      - name: Verify runner environment and Java 25
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:HYTALE_SERVER_JAR)) {
            throw 'HYTALE_SERVER_JAR is not available to the runner process.'
          }
          if ([string]::IsNullOrWhiteSpace($env:HYTALE_ASSETS_PATH)) {
            throw 'HYTALE_ASSETS_PATH is not available to the runner process.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_SERVER_JAR -PathType Leaf)) {
            throw 'HYTALE_SERVER_JAR does not point to an existing file.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_ASSETS_PATH -PathType Leaf)) {
            throw 'HYTALE_ASSETS_PATH does not point to an existing file.'
          }
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) {
            throw 'actions/setup-java did not provide JAVA_HOME.'
          }

          $javac25 = Join-Path $env:JAVA_HOME 'bin\javac.exe'
          if (-not (Test-Path -LiteralPath $javac25 -PathType Leaf)) {
            throw "javac.exe was not found below JAVA_HOME: $($env:JAVA_HOME)"
          }
          $javacVersion = (& cmd.exe /d /c "`"$javac25`" -version 2>&1" | Out-String).Trim()
          Write-Host "Selected Java home: $($env:JAVA_HOME)"
          Write-Host $javacVersion
          if (-not $javacVersion.StartsWith('javac 25')) {
            throw "Selected Java installation is not Java 25: $javacVersion"
          }

          Write-Host 'Hytale server JAR: OK'
          Write-Host 'Hytale Assets.zip: OK'

      - name: Download tested CI plugin
        if: needs.authorize.outputs.artifact_available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.authorize.outputs.artifact_name }}
          path: build/libs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize.outputs.artifact_run_id }}

      - name: Record CI artifact reuse
        if: needs.authorize.outputs.artifact_available == 'true'
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $jars = @(Get-ChildItem -Path 'build\libs' -Filter 'hytale-civ-*.jar' -File)
          if ($jars.Count -ne 1) {
            throw "Expected exactly one downloaded Civ plugin JAR, found $($jars.Count)."
          }
          Write-Host "Reusing tested CI plugin: $($jars[0].Name)"
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Plugin source: **tested CI artifact**"
          }

      - name: Run tests and build Civ plugin fallback
        if: needs.authorize.outputs.artifact_available != 'true'
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $javaVersion = (& cmd.exe /d /c "java -version 2>&1" | Out-String).Trim()
          Write-Host $javaVersion

          $gradleTimer = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            .\gradlew.bat test jar --no-daemon
            if ($LASTEXITCODE -ne 0) {
              throw 'Gradle tests or jar build failed.'
            }
          } finally {
            $gradleTimer.Stop()
            $seconds = [Math]::Round($gradleTimer.Elapsed.TotalSeconds, 2)
            Write-Host "HCIV_TIMING gradle_test_jar_seconds=$seconds"
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Plugin source: **local Gradle fallback**"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Gradle test + jar: **$seconds s**"
            }
          }

      - name: Run selected Hytale scenarios
        timeout-minutes: 2
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          REQUESTED_SCENARIOS: ${{ needs.authorize.outputs.scenarios }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeTimer = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            $scenarios = $env:REQUESTED_SCENARIOS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
            if ($scenarios.Count -eq 0) {
              throw 'Authorized runtime scenario list is empty.'
            }

            $budgets = @{
              woodcutter = 90
              minesupport = 90
              soldier = 60
              persistence = 150
              warmruntime = 150
            }
            $timeoutSeconds = 0
            foreach ($scenario in $scenarios) {
              if ($budgets.ContainsKey($scenario)) {
                $timeoutSeconds += $budgets[$scenario]
              } else {
                $timeoutSeconds += 90
              }
            }
            $timeoutSeconds = [Math]::Max(60, [Math]::Min(360, $timeoutSeconds))
            Write-Host "Runtime time budget: $timeoutSeconds seconds for $($scenarios -join ', ')"

            $scenarioLiteral = ($scenarios | ForEach-Object { "'$_'" }) -join ', '
            $stdoutLog = Join-Path $env:RUNNER_TEMP ("hytale-runtime-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).stdout.log")
            $stderrLog = Join-Path $env:RUNNER_TEMP ("hytale-runtime-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).stderr.log")
            $statusLog = Join-Path $env:RUNNER_TEMP ("hytale-runtime-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).status")
            $env:HCIV_RUNTIME_STATUS_FILE = $statusLog
            $childCommand = "try { & '.\scripts\hytale-runtime-tests.ps1' -Scenarios @($scenarioLiteral); Set-Content -LiteralPath `$env:HCIV_RUNTIME_STATUS_FILE -Value '0' -NoNewline; exit 0 } catch { Write-Error `$_; Set-Content -LiteralPath `$env:HCIV_RUNTIME_STATUS_FILE -Value '1' -NoNewline; exit 1 }"
            $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($childCommand))
            Remove-Item -LiteralPath $stdoutLog, $stderrLog, $statusLog -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath 'powershell.exe' `
              -ArgumentList @('-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', $encodedCommand) `
              -WorkingDirectory $PWD `
              -RedirectStandardOutput $stdoutLog `
              -RedirectStandardError $stderrLog `
              -PassThru

            $exitCode = $null
            $finished = $process.WaitForExit($timeoutSeconds * 1000)
            if (-not $finished) {
              Write-Warning "Hytale runtime exceeded its $timeoutSeconds second budget; terminating process tree."
              $killer = Start-Process -FilePath 'taskkill.exe' `
                -ArgumentList @('/PID', [string]$process.Id, '/T', '/F') `
                -WindowStyle Hidden `
                -PassThru
              if (-not $killer.WaitForExit(5000)) {
                Stop-Process -Id $killer.Id -Force -ErrorAction SilentlyContinue
                Write-Warning 'taskkill itself exceeded 5 seconds and was terminated.'
              }
              if (-not $process.WaitForExit(5000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                Write-Warning 'Runtime wrapper process still existed after taskkill and was force-stopped.'
              }
            } else {
              $process.Refresh()
              $exitCode = $process.ExitCode
            }

            $stdout = if (Test-Path -LiteralPath $stdoutLog) { Get-Content -LiteralPath $stdoutLog -Raw } else { '' }
            $stderr = if (Test-Path -LiteralPath $stderrLog) { Get-Content -LiteralPath $stderrLog -Raw } else { '' }
            Write-Host '----- Hytale runtime stdout -----'
            Write-Host $stdout
            Write-Host '----- Hytale runtime stderr -----'
            Write-Host $stderr
            Write-Host '----- end Hytale runtime output -----'

            if (-not $finished) {
              throw "Hytale runtime scenarios exceeded the $timeoutSeconds second time budget."
            }

            $statusCode = $null
            if (Test-Path -LiteralPath $statusLog -PathType Leaf) {
              $statusText = (Get-Content -LiteralPath $statusLog -Raw).Trim()
              if ($statusText -match '^[01]$') {
                $statusCode = [int]$statusText
              } else {
                throw "Hytale runtime status marker contained an unexpected value: '$statusText'."
              }
            }

            if ($null -eq $exitCode) {
              if ($null -eq $statusCode) {
                throw 'Hytale runtime scenarios completed but neither their process exit code nor child status marker was available.'
              }
              Write-Warning "Hytale runtime process exit code was unavailable; using child status marker $statusCode."
              $exitCode = $statusCode
            } elseif ($null -ne $statusCode -and $exitCode -ne $statusCode) {
              throw "Hytale runtime process exit code $exitCode disagreed with child status marker $statusCode."
            }

            if ($exitCode -ne 0) {
              throw "Hytale runtime scenarios exited with code $exitCode."
            }
          } finally {
            $runtimeTimer.Stop()
            $seconds = [Math]::Round($runtimeTimer.Elapsed.TotalSeconds, 2)
            Write-Host "HCIV_TIMING runtime_wrapper_seconds=$seconds"
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Hytale runtime wrapper: **$seconds s**"
            }
          }

      - name: Upload Hytale runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hytale-runtime-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hytale-runtime-${{ github.run_id }}-${{ github.run_attempt }}.stdout.log
            ${{ runner.temp }}/hytale-runtime-${{ github.run_id }}-${{ github.run_attempt }}.stderr.log
            ${{ runner.temp }}/hytale-runtime-${{ github.run_id }}-${{ github.run_attempt }}.status
          if-no-files-found: warn
          retention-days: 14