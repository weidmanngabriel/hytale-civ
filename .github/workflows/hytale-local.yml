name: Hytale Local Runtime Probe

on:
  workflow_run:
    workflows: ["Hytale Runtime Request"]
    types: [completed]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize Hytale runtime request
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      requested_by: ${{ steps.gate.outputs.requested_by }}
      scenarios: ${{ steps.gate.outputs.scenarios }}

    steps:
      - name: Validate tag request
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('authorized', 'false');

            const upstream = context.payload.workflow_run;
            const allowedActors = new Set(['weidmanngabriel']);
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/hytale-runtime-request.yml';
            const tagPattern = /^hytale-test\/([a-z0-9]+(?:-[a-z0-9]+)*)\/([0-9a-f]{7,12})$/;

            if (!upstream || upstream.event !== 'push') {
              console.log('Ignoring runtime request because the upstream workflow was not triggered by push.');
              return;
            }

            if (upstream.head_repository?.full_name !== expectedRepository) {
              core.setFailed(`Upstream workflow repository is not trusted: ${upstream.head_repository?.full_name ?? 'unknown'}.`);
              return;
            }

            const workflowPath = (upstream.path ?? '').split('@')[0];
            if (workflowPath !== expectedWorkflowPath) {
              core.setFailed(`Upstream workflow path is not trusted: ${workflowPath || 'missing'}.`);
              return;
            }

            const actor = upstream.actor?.login;
            const triggeringActor = upstream.triggering_actor?.login;
            if (!allowedActors.has(actor) || !allowedActors.has(triggeringActor)) {
              core.setFailed('Runtime tests may only be requested by an explicitly authorized actor.');
              return;
            }

            const tagName = upstream.head_branch ?? '';
            const match = tagName.match(tagPattern);
            if (!match) {
              console.log(`Ignoring upstream workflow because its ref is not a valid hytale-test tag: ${tagName || 'missing'}.`);
              return;
            }

            const scenarioPart = match[1];
            const shortSha = match[2].toLowerCase();
            const headSha = (upstream.head_sha ?? '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('Upstream workflow returned an invalid commit SHA.');
              return;
            }
            if (!headSha.startsWith(shortSha)) {
              core.setFailed(`Tag SHA suffix ${shortSha} does not match upstream commit ${headSha}.`);
              return;
            }

            const { owner, repo } = context.repo;
            let tagRef;
            try {
              const response = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });
              tagRef = response.data;
            } catch (error) {
              if (error.status === 404) {
                console.log(`Ignoring stale runtime request because refs/tags/${tagName} no longer exists.`);
                return;
              }
              throw error;
            }

            if (tagRef.object?.type !== 'commit') {
              core.setFailed('Only lightweight hytale-test tags that point directly to a commit are accepted.');
              return;
            }
            if ((tagRef.object?.sha ?? '').toLowerCase() !== headSha) {
              core.setFailed('The runtime test tag no longer points to the exact commit that triggered the request.');
              return;
            }

            const registryResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'scripts/hytale-runtime-scenarios.json',
              ref: headSha,
            });
            if (Array.isArray(registryResponse.data) || !registryResponse.data.content) {
              core.setFailed('Runtime scenario registry is missing or is not a file.');
              return;
            }

            let registry;
            try {
              const decoded = Buffer.from(registryResponse.data.content, 'base64').toString('utf8');
              registry = JSON.parse(decoded);
            } catch (error) {
              core.setFailed(`Runtime scenario registry is not valid JSON: ${error.message}`);
              return;
            }

            if (registry?.version !== 1 || !Array.isArray(registry?.scenarios) || registry.scenarios.length === 0) {
              core.setFailed('Runtime scenario registry has an unsupported shape.');
              return;
            }

            const scenarioNamePattern = /^[a-z][a-z0-9]{0,31}$/;
            const registered = [];
            for (const scenario of registry.scenarios) {
              if (typeof scenario !== 'string' || !scenarioNamePattern.test(scenario) || scenario === 'all') {
                core.setFailed(`Runtime scenario registry contains an invalid name: ${String(scenario)}.`);
                return;
              }
              if (registered.includes(scenario)) {
                core.setFailed(`Runtime scenario registry contains a duplicate: ${scenario}.`);
                return;
              }
              registered.push(scenario);
            }

            let selected;
            if (scenarioPart === 'all') {
              selected = registered;
            } else {
              const requested = scenarioPart.split('-');
              if (requested.length > 8) {
                core.setFailed('At most 8 explicit runtime scenarios may be requested; use all for larger suites.');
                return;
              }
              if (new Set(requested).size !== requested.length) {
                core.setFailed('Runtime scenario list contains duplicates.');
                return;
              }

              const unknown = requested.filter(scenario => !registered.includes(scenario));
              if (unknown.length > 0) {
                core.setFailed(`Unknown runtime scenario(s): ${unknown.join(', ')}. Registered: ${registered.join(', ')}.`);
                return;
              }
              selected = requested;
            }

            core.setOutput('authorized', 'true');
            core.setOutput('tag_name', tagName);
            core.setOutput('head_sha', headSha);
            core.setOutput('requested_by', actor);
            core.setOutput('scenarios', selected.join(','));

            console.log('Authorized Hytale runtime request');
            console.log(`Tag: ${tagName}`);
            console.log(`Commit: ${headSha}`);
            console.log(`Requested by: ${actor}`);
            console.log(`Scenarios: ${selected.join(', ')}`);

  local-runtime-probe:
    name: Verify local Hytale gameplay runtime
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, Windows, X64, hytale-local]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify authorized revision and request
        shell: powershell
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.head_sha }}
          REQUEST_TAG: ${{ needs.authorize.outputs.tag_name }}
          REQUESTED_BY: ${{ needs.authorize.outputs.requested_by }}
          REQUESTED_SCENARIOS: ${{ needs.authorize.outputs.scenarios }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_SHA) {
            throw "Checked out $actualSha but authorized SHA is $($env:EXPECTED_SHA)."
          }

          Write-Host 'Hytale Runtime Test'
          Write-Host "Tag: $($env:REQUEST_TAG)"
          Write-Host "Commit: $actualSha"
          Write-Host "Requested by: $($env:REQUESTED_BY)"
          Write-Host "Scenarios: $($env:REQUESTED_SCENARIOS)"

      - name: Verify runner environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:HYTALE_SERVER_JAR)) {
            throw 'HYTALE_SERVER_JAR is not available to the runner process.'
          }
          if ([string]::IsNullOrWhiteSpace($env:HYTALE_ASSETS_PATH)) {
            throw 'HYTALE_ASSETS_PATH is not available to the runner process.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_SERVER_JAR -PathType Leaf)) {
            throw 'HYTALE_SERVER_JAR does not point to an existing file.'
          }
          if (-not (Test-Path -LiteralPath $env:HYTALE_ASSETS_PATH -PathType Leaf)) {
            throw 'HYTALE_ASSETS_PATH does not point to an existing file.'
          }

          $javacVersion = (& javac -version | Out-String).Trim()
          Write-Host $javacVersion
          if ($LASTEXITCODE -ne 0 -or -not $javacVersion.StartsWith('javac 25')) {
            throw 'The self-hosted runner must expose Java 25 on PATH for the Hytale runtime test.'
          }

          Write-Host 'Hytale server JAR: OK'
          Write-Host 'Hytale Assets.zip: OK'

      - name: Run tests and build Civ plugin
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat test jar --no-daemon
          if ($LASTEXITCODE -ne 0) {
            throw 'Gradle tests or jar build failed.'
          }

      - name: Run selected Hytale scenarios
        shell: powershell
        env:
          REQUESTED_SCENARIOS: ${{ needs.authorize.outputs.scenarios }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scenarios = $env:REQUESTED_SCENARIOS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($scenarios.Count -eq 0) {
            throw 'Authorized runtime scenario list is empty.'
          }
          .\scripts\hytale-runtime-tests.ps1 -Scenarios $scenarios

  cleanup-runtime-tag:
    name: Remove temporary Hytale runtime tag
    needs: [authorize, local-runtime-probe]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete exact temporary tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ needs.authorize.outputs.tag_name }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.head_sha }}
        with:
          script: |
            const tagName = process.env.TAG_NAME ?? '';
            const expectedSha = (process.env.EXPECTED_SHA ?? '').toLowerCase();
            const tagPattern = /^hytale-test\/[a-z0-9]+(?:-[a-z0-9]+)*\/[0-9a-f]{7,12}$/;

            if (!tagPattern.test(tagName) || !/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('Refusing to delete a runtime tag because validated cleanup inputs are malformed.');
              return;
            }

            const { owner, repo } = context.repo;
            let tagRef;
            try {
              const response = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });
              tagRef = response.data;
            } catch (error) {
              if (error.status === 404) {
                console.log(`Temporary runtime tag ${tagName} is already absent.`);
                return;
              }
              throw error;
            }

            if (tagRef.object?.type !== 'commit' || (tagRef.object?.sha ?? '').toLowerCase() !== expectedSha) {
              core.setFailed('Refusing to delete the runtime tag because it no longer points to the authorized commit.');
              return;
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `tags/${tagName}`,
            });
            console.log(`Deleted temporary runtime tag ${tagName}.`);
