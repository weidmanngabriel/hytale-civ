name: Temporary mine building boundary patch

on:
  push:
    branches:
      - fix/mine-building-boundary
    paths:
      - .github/workflows/tmp-mine-building-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mine-building-boundary
          fetch-depth: 0
      - name: Patch miner building-boundary validation
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path('src/main/java/dev/civilizations/hytale/MinerWorkSystem.java')
          text = path.read_text()

          replacements = [
              ('if (!validCandidate(world, mine, initial)) return null;', 'if (!validCandidate(world, mine, initial, true)) return null;'),
              ('if (validCandidate(world, mine, candidate)) result.add(new WeightedDirection(direction, weight));', 'if (validCandidate(world, mine, candidate, false)) result.add(new WeightedDirection(direction, weight));'),
              ('        MineSegment segment\n    ) {\n        UUID worldId = world.getWorldConfig().getUuid();\n        if (tunnelRegistry.conflicts(worldId, segment)) return false;\n        for (BlockPosition block : segment.blocks()) {\n            if (!safeBlock(world, mine, block)) return false;', '        MineSegment segment,\n        boolean allowOwnMine\n    ) {\n        UUID worldId = world.getWorldConfig().getUuid();\n        if (tunnelRegistry.conflicts(worldId, segment)) return false;\n        for (BlockPosition block : segment.blocks()) {\n            if (!safeBlock(world, mine, block, allowOwnMine)) return false;'),
              ('    private boolean safeBlock(\n        World world,\n        BuildingPlacementRegistry.BuildingInstance mine,\n        BlockPosition block\n    ) {\n        for (BuildingPlacementRegistry.BuildingInstance building :', '    private boolean safeBlock(\n        World world,\n        BuildingPlacementRegistry.BuildingInstance mine,\n        BlockPosition block\n    ) {\n        return safeBlock(world, mine, block, false);\n    }\n\n    private boolean safeBlock(\n        World world,\n        BuildingPlacementRegistry.BuildingInstance mine,\n        BlockPosition block,\n        boolean allowOwnMine\n    ) {\n        for (BuildingPlacementRegistry.BuildingInstance building :'),
              ('            if (!building.id().equals(mine.id()) && building.bounds().containsBlock(block)) return false;', '            if ((!allowOwnMine || !building.id().equals(mine.id()))\n                && building.bounds().containsBlock(block)) return false;'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Missing expected source fragment: ' + old)
              text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('src/test/java/dev/civilizations/hytale/MinerBuildingBoundaryContractTest.java')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_bytes(base64.b64decode(''))

          docs = Path('docs/mine-worker.md')
          doc = docs.read_text()
          note = '\n## Schutz vor Gebaeudegrenzen\n\nBevor ein Folgesegment reserviert wird, prueft Civ den vollstaendigen geplanten Tunnelkoerper gegen die `building_bounds` aller fertigen Civ-Gebaeude, einschliesslich der eigenen Mine. Kollidiert eine Richtung, wird sie vor der gewichteten Auswahl verworfen; sind alle drei moeglichen Richtungen blockiert, wird kein neues Segment angelegt. Nur das initiale Segment am `mine_tunnel_connector` darf die Bounds der eigenen Mine ignorieren, damit der Stollen den authored Ausgang sauber verlassen kann. Dieselbe Schutzregel gilt beim tatsaechlichen Blockabbau, sodass bereits gespeicherte problematische Folgesegmente nicht weiter in ein Gebaeude hinein gegraben werden. Die Pruefung arbeitet auf den tatsaechlichen Segmentbloecken und ist daher nicht auf 4x4x8 fest verdrahtet.\n'
          if '## Schutz vor Gebaeudegrenzen' not in doc:
              doc = doc.rstrip() + '\n' + note
          docs.write_text(doc)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/civilizations/hytale/MinerWorkSystem.java src/test/java/dev/civilizations/hytale/MinerBuildingBoundaryContractTest.java docs/mine-worker.md
          git commit -m "Protect buildings from mine tunnel continuations"
          git push origin HEAD:fix/mine-building-boundary
