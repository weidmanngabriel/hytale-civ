name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project_version: ${{ steps.version.outputs.project_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          configured_version="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1)"
          if [[ -z "$configured_version" ]]; then
            echo "projectVersion is missing from gradle.properties." >&2
            exit 1
          fi

          base_version="${configured_version%-SNAPSHOT}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            project_version="${GITHUB_REF_NAME#v}"
            release_tag="$GITHUB_REF_NAME"
          else
            project_version="$base_version-dev.$GITHUB_RUN_NUMBER"
            release_tag="v$project_version"
          fi

          echo "project_version=$project_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests
        run: ./gradlew test --stacktrace -PprojectVersion=${{ steps.version.outputs.project_version }}

      - name: Build plugin and release bundle
        run: ./gradlew build --stacktrace -PprojectVersion=${{ steps.version.outputs.project_version }}

      - name: Upload SHA-addressed Hytale runtime plugin
        uses: actions/upload-artifact@v4
        with:
          name: hytale-runtime-plugin-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/libs/hytale-civ-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Run bare Hytale server probe
        timeout-minutes: 2
        run: ./gradlew hytaleServerBareProbe --no-configuration-cache --stacktrace -PprojectVersion=${{ steps.version.outputs.project_version }}

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: hytale-release-bundle
          path: build/distributions/*-bundle.zip
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore

  mcp:
    name: Local MCP (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test MCP protocol and lifecycle guards
        run: node --test tools/hytale-mcp/test/*.test.mjs

  viewer:
    name: Browser Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-viewer/package-lock.json
      - run: npm ci --prefix web-viewer
      - run: npm test --prefix web-viewer
      - run: npm run build --prefix web-viewer

  release:
    name: Publish GitHub Release
    needs: [build, mcp, viewer]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Download tested release bundle
        uses: actions/download-artifact@v4
        with:
          name: hytale-release-bundle
          path: release-artifact

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          PROJECT_VERSION: ${{ needs.build.outputs.project_version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail

          bundle_path="$(find release-artifact -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [[ -z "$bundle_path" ]]; then
            echo "No release bundle found in downloaded artifact." >&2
            exit 1
          fi

          commit_subject="$(git log -1 --pretty=%s HEAD)"
          if [[ -z "$commit_subject" ]]; then
            commit_subject="Automated Hytale Civ build."
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            prerelease="false"
          else
            prerelease="true"
          fi

          title="Hytale Civ $RELEASE_TAG"
          asset="hytale-civ-$PROJECT_VERSION.zip"
          cp "$bundle_path" "$asset"

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$commit_subject"
            echo
            echo "Commit: ${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          # gh release create normally creates the tag itself. A previous failed release
          # attempt can leave that tag behind without a GitHub Release, so explicitly
          # target the existing tag when it is already present.
          release_target="$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            release_target="$RELEASE_TAG"
          fi

          args=(
            release create "$RELEASE_TAG" "$RELEASE_ASSET"
            --repo "$GITHUB_REPOSITORY"
            --target "$release_target"
            --title "$RELEASE_TITLE"
            --notes "$RELEASE_NOTES"
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
