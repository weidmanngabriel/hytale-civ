name: Temporary Miner Source Patch

on:
  push:
    branches:
      - agent/miner-work-front-v1

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/miner-work-front-v1
          fetch-depth: 0
      - name: Patch miner source
        run: python3 scripts/tmp-miner-source-patch.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/civilizations/hytale/MinerWorkSystem.java
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Tighten miner work-front execution"
          git push origin HEAD:agent/miner-work-front-v1
