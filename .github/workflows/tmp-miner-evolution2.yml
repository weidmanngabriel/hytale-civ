name: Temporary miner evolution patch 2
on:
  push:
    branches: [feature/miner-resume-variable-tunnels]
    paths: [.github/workflows/tmp-miner-evolution2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/miner-resume-variable-tunnels
          fetch-depth: 0
      - name: Patch production code
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/main/java/dev/civilizations/hytale/MinerWorkSystem.java')
          s = p.read_text()

          s = s.replace(
              '        if (!activityRegistry.autonomousWorkAllowed(ref)) {\n            stopMiningAnimation(ref, store, runtime);\n            return;\n        }',
              '        if (!activityRegistry.autonomousWorkAllowed(ref)) {\n            stopMiningAnimation(ref, store, runtime);\n            runtime.interruptForManualMove();\n            return;\n        }', 1)

          s = s.replace(
              '        UUID worldId = world.getWorldConfig().getUuid();\n\n        MineSegment reopened = earliestReopenedCompletedSegment(world, mine.id());',
              '        UUID worldId = world.getWorldConfig().getUuid();\n\n        if (runtime.resumeAfterManual) {\n            MineSegment resumed = chooseResumeSegment(world, mine, runtime);\n            if (resumed != null) {\n                runtime.resumeAfterManual = false;\n                runtime.interruptedSegmentId = null;\n                runtime.segmentId = resumed.id();\n                return resumed;\n            }\n        }\n\n        MineSegment reopened = earliestReopenedCompletedSegment(world, mine.id());', 1)

          s = re.sub(
              r'        MineDirection direction = outwardDirection\(mine\.bounds\(\), connector\.bounds\(\)\);\n        MineSegment initial = MineSegment\.reserved\(.*?\n        if \(!validCandidate\(world, mine, initial, true\)\) return null;',
              '''        MineDirection direction = outwardDirection(mine.bounds(), connector.bounds());
        MineSegment initial = fittingCandidate(
            world, mine, null, initialStart(connector.bounds(), direction), direction, true
        );
        if (initial == null) return null;''',
              s, count=1, flags=re.S)

          s = s.replace('MineTuning.blocksPerSegment()', 'segment.blockCount()')
          s = s.replace('MineTuning.supportFramesPerSegment()', 'MineTuning.supportFramesForLength(segment.lengthBlocks())')
          s = s.replace('MineTuning.SEGMENT_LENGTH_BLOCKS - 1', 'segment.lengthBlocks() - 1')
          s = s.replace(
              '        int oneBasedDepth = depth + 1;\n        if (oneBasedDepth % MineTuning.SUPPORT_SPACING_BLOCKS != 0) return false;',
              '        int oneBasedDepth = depth + 1;\n        if (oneBasedDepth >= segment.lengthBlocks()) return false;\n        if (oneBasedDepth % MineTuning.SUPPORT_SPACING_BLOCKS != 0) return false;', 1)

          start = s.index('    private MineSegment chooseNext(')
          end = s.index('    private boolean validCandidate(', start)
          replacement = '''    private MineSegment chooseNext(
        World world,
        BuildingPlacementRegistry.BuildingInstance mine,
        MineSegment parent
    ) {
        List<WeightedCandidate> valid = new ArrayList<>();
        addIfValid(world, mine, parent, parent.direction(), MineTuning.STRAIGHT_WEIGHT, valid);
        addIfValid(world, mine, parent, parent.direction().left(), MineTuning.LEFT_WEIGHT, valid);
        addIfValid(world, mine, parent, parent.direction().right(), MineTuning.RIGHT_WEIGHT, valid);
        MineSegment next = selectWeighted(valid);
        if (next != null) tunnelRegistry.put(world, next);
        return next;
    }

    private MineSegment chooseResumeSegment(
        World world,
        BuildingPlacementRegistry.BuildingInstance mine,
        WorkerRuntime runtime
    ) {
        UUID worldId = world.getWorldConfig().getUuid();
        List<MineSegment> alternatives = tunnelRegistry.segmentsForMine(worldId, mine.id()).stream()
            .filter(candidate -> candidate.status() == MineSegment.Status.RESERVED
                || candidate.status() == MineSegment.Status.MINING)
            .filter(candidate -> runtime.interruptedSegmentId == null
                || !candidate.id().equals(runtime.interruptedSegmentId))
            .toList();
        if (!alternatives.isEmpty()) {
            return alternatives.get(ThreadLocalRandom.current().nextInt(alternatives.size()));
        }

        MineSegment fresh = chooseFreshBranch(world, mine);
        if (fresh != null) {
            tunnelRegistry.put(world, fresh);
            return fresh;
        }

        if (runtime.interruptedSegmentId != null) {
            MineSegment interrupted = tunnelRegistry.get(worldId, runtime.interruptedSegmentId);
            if (interrupted != null && interrupted.status() != MineSegment.Status.BLOCKED) return interrupted;
        }
        return tunnelRegistry.unfinishedForMine(worldId, mine.id());
    }

    private MineSegment chooseFreshBranch(
        World world,
        BuildingPlacementRegistry.BuildingInstance mine
    ) {
        List<WeightedCandidate> valid = new ArrayList<>();
        for (MineSegment parent : tunnelRegistry.segmentsForMine(world.getWorldConfig().getUuid(), mine.id())) {
            if (parent.status() != MineSegment.Status.COMPLETE) continue;
            addIfValid(world, mine, parent, parent.direction(), MineTuning.STRAIGHT_WEIGHT, valid);
            addIfValid(world, mine, parent, parent.direction().left(), MineTuning.LEFT_WEIGHT, valid);
            addIfValid(world, mine, parent, parent.direction().right(), MineTuning.RIGHT_WEIGHT, valid);
        }
        return selectWeighted(valid);
    }

    private void addIfValid(
        World world,
        BuildingPlacementRegistry.BuildingInstance mine,
        MineSegment parent,
        MineDirection direction,
        int weight,
        List<WeightedCandidate> result
    ) {
        MineSegment candidate = fittingCandidate(world, mine, parent, parent.nextStart(direction), direction, false);
        if (candidate != null) result.add(new WeightedCandidate(candidate, weight));
    }

    private MineSegment fittingCandidate(
        World world,
        BuildingPlacementRegistry.BuildingInstance mine,
        MineSegment parent,
        BlockPosition start,
        MineDirection direction,
        boolean allowOwnMine
    ) {
        int minimumLength = MineTuning.MIN_SEGMENT_LENGTH_BLOCKS;
        if (parent != null && direction != parent.direction()) {
            minimumLength = Math.max(minimumLength, MineTuning.TUNNEL_WIDTH_BLOCKS + 1);
        }
        int desiredLength = Math.max(minimumLength, randomSegmentLength());
        for (int length = desiredLength; length >= minimumLength; length--) {
            MineSegment candidate = MineSegment.reserved(
                UUID.randomUUID(), mine.id(), parent == null ? null : parent.id(), start, direction, length
            );
            if (validCandidate(world, mine, candidate, allowOwnMine)) return candidate;
        }
        return null;
    }

    private static int randomSegmentLength() {
        return ThreadLocalRandom.current().nextInt(
            MineTuning.MIN_SEGMENT_LENGTH_BLOCKS, MineTuning.MAX_SEGMENT_LENGTH_BLOCKS + 1
        );
    }

    private static MineSegment selectWeighted(List<WeightedCandidate> valid) {
        if (valid.isEmpty()) return null;
        int total = valid.stream().mapToInt(WeightedCandidate::weight).sum();
        int roll = ThreadLocalRandom.current().nextInt(total);
        for (WeightedCandidate option : valid) {
            if (roll < option.weight()) return option.segment();
            roll -= option.weight();
        }
        return valid.getLast().segment();
    }

'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('private record WeightedDirection(MineDirection direction, int weight)', 'private record WeightedCandidate(MineSegment segment, int weight)')

          s = s.replace(
              '        private boolean pathFailureNotified;\n',
              '''        private boolean pathFailureNotified;
        private boolean resumeAfterManual;
        private UUID interruptedSegmentId;

        private void interruptForManualMove() {
            if (!resumeAfterManual) interruptedSegmentId = segmentId;
            resumeAfterManual = true;
            segmentId = null;
            enteredMine = false;
            workElapsed = 0.0;
            navigationArrived();
        }
''', 1)
          s = s.replace(
              '            retryElapsed = 0.0;\n            navigationArrived();',
              '            retryElapsed = 0.0;\n            resumeAfterManual = false;\n            interruptedSegmentId = null;\n            navigationArrived();', 1)
          p.write_text(s)

          plugin = Path('src/main/java/dev/civilizations/plugin/CivilizationsPlugin.java')
          q = plugin.read_text().replace(
              'new CivManualMovementSystem(unitRegistry, activityRegistry)',
              'new CivManualMovementSystem(unitRegistry, activityRegistry, buildingRegistry)', 1)
          plugin.write_text(q)
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          git commit -m "Implement flexible miner routing and segment lengths"
          git push origin HEAD:feature/miner-resume-variable-tunnels
      - name: Compile production code
        run: ./gradlew compileJava
