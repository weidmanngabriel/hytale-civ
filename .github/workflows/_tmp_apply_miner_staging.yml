name: Apply miner staging patch

on:
  push:
    branches:
      - fix/miner-entry-and-turn-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miner-entry-and-turn-staging
          fetch-depth: 0

      - name: Apply focused miner navigation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          miner_path = Path("src/main/java/dev/civilizations/hytale/MinerWorkSystem.java")
          source = miner_path.read_text()

          resolve_anchor = "        MineSegment segment = resolveSegment(world, mine, connector, runtime);\n"
          if source.count(resolve_anchor) != 1:
              raise SystemExit(f"resolve anchor count={source.count(resolve_anchor)}")
          connector_gate = """        if (!runtime.reachedConnector) {
              Vector3d target = center(connector.bounds(), connector.bounds().minY());
              if (!arrived(position, target)) {
                  navigateTo(ref, position, target, runtime);
                  stopMiningAnimation(ref, store, runtime);
                  return;
              }
              runtime.reachedConnector = true;
              runtime.navigationArrived();
          }

          """
          source = source.replace(resolve_anchor, connector_gate + resolve_anchor, 1)

          work_anchor = "        Vector3d workTarget = workTarget(segment);\n"
          if source.count(work_anchor) != 1:
              raise SystemExit(f"work anchor count={source.count(work_anchor)}")
          turn_gate = """        if (isTurnSegment(worldId, segment) && !segment.id().equals(runtime.turnStagedSegmentId)) {
              Vector3d junctionTarget = turnStagingTarget(segment);
              if (!arrived(position, junctionTarget)) {
                  navigateTo(ref, position, junctionTarget, runtime);
                  stopMiningAnimation(ref, store, runtime);
                  return;
              }
              runtime.turnStagedSegmentId = segment.id();
              runtime.navigationArrived();
              unitRegistry.clearMoveTarget(ref);
              stopMiningAnimation(ref, store, runtime);
              return;
          }

          """
          source = source.replace(work_anchor, turn_gate + work_anchor, 1)

          helper_anchor = "    private static Vector3d workTarget(MineSegment segment) {\n"
          if source.count(helper_anchor) != 1:
              raise SystemExit(f"helper anchor count={source.count(helper_anchor)}")
          helper = """    private boolean isTurnSegment(UUID worldId, MineSegment segment) {
              if (segment.parentId() == null) return false;
              MineSegment parent = tunnelRegistry.get(worldId, segment.parentId());
              return parent != null && parent.direction() != segment.direction();
          }

          static Vector3d turnStagingTarget(MineSegment segment) {
              int faceSize = MineTuning.TUNNEL_WIDTH_BLOCKS * MineTuning.TUNNEL_HEIGHT_BLOCKS;
              int sharedDepth = Math.min(MineTuning.TUNNEL_WIDTH_BLOCKS, segment.lengthBlocks());
              double x = 0.0;
              double z = 0.0;
              int cells = 0;
              for (int depth = 0; depth < sharedDepth; depth++) {
                  int first = depth * faceSize;
                  for (int width = 0; width < MineTuning.TUNNEL_WIDTH_BLOCKS; width++) {
                      BlockPosition block = segment.blockAtIndex(first + width);
                      x += block.x() + 0.5;
                      z += block.z() + 0.5;
                      cells++;
                  }
              }
              return new Vector3d(x / cells, segment.start().y(), z / cells);
          }

          """
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          field_anchor = "        private boolean enteredMine;\n"
          if source.count(field_anchor) != 1:
              raise SystemExit(f"runtime field anchor count={source.count(field_anchor)}")
          source = source.replace(
              field_anchor,
              field_anchor + "        private boolean reachedConnector;\n        private UUID turnStagedSegmentId;\n",
              1
          )

          reset_anchor = "            enteredMine = false;\n"
          if source.count(reset_anchor) != 2:
              raise SystemExit(f"enteredMine reset count={source.count(reset_anchor)}")
          source = source.replace(
              reset_anchor,
              reset_anchor + "            reachedConnector = false;\n            turnStagedSegmentId = null;\n"
          )
          miner_path.write_text(source)

          mine_doc = Path("docs/mine-worker.md")
          text = mine_doc.read_text()
          old = "- Der Bewohner läuft zuerst über `workplace_access` und arbeitet anschließend am `mine_tunnel_connector` beziehungsweise an einer offenen Arbeitsfront im bestehenden Stollensystem."
          new = "- Der Bewohner läuft beim Betreten beziehungsweise Wiedereintreten zuerst über `workplace_access` und danach zwingend zum `mine_tunnel_connector`. Erst wenn der Connector erreicht ist, darf Civ eine offene Arbeitsfront auswählen und als nächstes Navigationsziel setzen."
          if old not in text:
              raise SystemExit("mine entry doc anchor not found")
          text = text.replace(old, new, 1)
          needle = "- Nach einem fertigen Abschnitt entscheidet der Abbauer selbst zwischen geradeaus, links und rechts. Ungültige Richtungen fallen aus der Auswahl. Geradeaus wird zunächst mit 60 %, links und rechts jeweils mit 20 % gewichtet. Ein direktes Umdrehen ist ausgeschlossen.\n"
          if needle not in text:
              raise SystemExit("mine turn doc anchor not found")
          text = text.replace(needle, needle + "- Bei einer 90°-Kurve läuft der Miner vor dem eigentlichen Abbau einmal zum Mittelpunkt der bereits offenen gemeinsamen 4×4-Kreuzungsfläche. Erst danach wird die neue seitliche Arbeitsfront als Ziel gesetzt. So muss Hytales Pathfinder nie direkt eine noch geschlossene Seitenwand als erreichbares Bewegungsziel behandeln.\n", 1)
          old = "- Nach dem manuellen Auftrag muss der Miner nicht zwingend zu exakt der Front zurückkehren, an der er unterbrochen wurde. Beim Wiederaufnehmen sucht Civ zuerst nach einer anderen begonnenen Arbeitsfront. Gibt es keine, kann an einem abgeschlossenen Segment ein neuer gültiger Tunnelast angelegt werden. Nur wenn keine Alternative existiert, wird der unterbrochene Abschnitt wieder aufgenommen."
          new = "- Nach dem manuellen Auftrag muss der Miner nicht zwingend zu exakt der Front zurückkehren, an der er unterbrochen wurde. Beim Wiederaufnehmen läuft er zuerst über `workplace_access` und `mine_tunnel_connector`; erst danach sucht Civ nach einer anderen begonnenen Arbeitsfront. Gibt es keine, kann an einem abgeschlossenen Segment ein neuer gültiger Tunnelast angelegt werden. Nur wenn keine Alternative existiert, wird der unterbrochene Abschnitt wieder aufgenommen."
          if old not in text:
              raise SystemExit("mine resume doc anchor not found")
          mine_doc.write_text(text.replace(old, new, 1))

          nav_doc = Path("docs/hytale/npc-navigation.md")
          text = nav_doc.read_text()
          needle = "- Die Navigation zielt auf die Arbeitsposition der aktuellen Tunnel-Front. Ist diese Position erreicht, darf der Arbeiter die dazugehörige Arbeitsfront bearbeiten; einzelne Blöcke derselben Front erhalten keine zusätzliche künstliche Civ-Reichweitengrenze.\n"
          if needle not in text:
              raise SystemExit("navigation doc anchor not found")
          addition = "- Beim autonomen Betreten oder Wiedereintreten einer Mine wird die Navigation gestaffelt: zuerst `workplace_access`, danach `mine_tunnel_connector`, erst danach eine Tunnel-Arbeitsposition. Dadurch bekommt der native Pathfinder nicht direkt von oberhalb des Gebäudes ein tiefes unterirdisches Ziel.\n- Bei einer Links-/Rechtskurve dient der Mittelpunkt der bereits offenen gemeinsamen 4×4-Kreuzungsfläche einmalig als Zwischenziel, bevor Civ die neue seitliche Arbeitsfront setzt. Die eigentliche Wegfindung zwischen diesen semantischen Zielen bleibt vollständig bei Hytales `Seek`.\n"
          nav_doc.write_text(text.replace(needle, needle + addition, 1))

          concept = Path("docs/concept.md")
          text = concept.read_text()
          needle = "- Ein Rechtsklick auf einen Bodenblock gibt dem ausgewählten Bewohner ein direktes Bewegungsziel. Dieser manuelle Befehl pausiert seine automatische Berufsarbeit. Sobald der Bewohner das Ziel erreicht hat, endet der manuelle Auftrag; nach einer gemeinsamen Wiederanlaufpause von zwei Sekunden darf der bereits zugewiesene Beruf automatisch mit seinem unveränderten Zustand weiterarbeiten. Der Beruf muss nicht erneut zugewiesen werden.\n"
          if needle not in text:
              raise SystemExit("concept anchor not found")
          concept.write_text(text.replace(needle, needle + "- Für Minenabbauer ist die automatische Wiederaufnahme bewusst gestaffelt: Nach einer manuellen Ausfahrt läuft der Bewohner zuerst zum Minenzugang und zum `mine_tunnel_connector`. Bei einer Tunnelkurve wird zusätzlich die bereits offene 4×4-Kreuzungsfläche betreten, bevor die neue seitliche Arbeitsfront beginnt.\n", 1))
          PY

      - name: Commit focused patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/civilizations/hytale/MinerWorkSystem.java docs/mine-worker.md docs/hytale/npc-navigation.md docs/concept.md
          git commit -m "Stage miner entry and tunnel turns"
          git push origin HEAD:fix/miner-entry-and-turn-staging
