name: Patch mine end support

on:
  push:
    branches:
      - fix/mine-skip-end-support

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mine-skip-end-support
          fetch-depth: 0

      - name: Apply focused source change
        shell: python
        run: |
          from pathlib import Path

          miner = Path('src/main/java/dev/civilizations/hytale/MinerWorkSystem.java')
          text = miner.read_text()
          old = '        int supportsPerSegment = MineTuning.SEGMENT_LENGTH_BLOCKS / MineTuning.SUPPORT_SPACING_BLOCKS;\n'
          new = '        int supportsPerSegment = MineTuning.supportFramesPerSegment();\n'
          if old not in text:
              raise SystemExit('MinerWorkSystem support-count line not found')
          miner.write_text(text.replace(old, new, 1))

          Path('.github/workflows/patch-mine-end-support.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Skip support frame at mine segment junction"
          git push origin HEAD:fix/mine-skip-end-support
