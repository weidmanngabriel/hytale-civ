name: Apply mine upgrade resume patch

on:
  push:
    branches:
      - fix/mine-upgrade-resume-frame

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mine-upgrade-resume-frame
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply focused prefab and miner changes
        run: python3 scripts/_apply_mine_upgrade_resume_patch.py

      - name: Validate patch
        run: |
          git diff --check
          ./gradlew test

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            asset-pack/Server/Prefabs/Civilizations/Mine/Mine_01.prefab.json \
            asset-pack/Server/Prefabs/Civilizations/Mine/Mine_02.prefab.json \
            asset-pack/Server/Prefabs/Civilizations/Mine/Mine_03.prefab.json \
            src/main/java/dev/civilizations/hytale/MinerWorkSystem.java
          git diff --cached --quiet && { echo "Expected patch produced no changes"; exit 1; }
          git commit -m "Resume miners after upgrades and protect mine portal"
          git push origin HEAD:fix/mine-upgrade-resume-frame
