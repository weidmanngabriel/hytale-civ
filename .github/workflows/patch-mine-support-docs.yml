name: Patch mine support docs

on:
  push:
    branches:
      - fix/mine-skip-end-support

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mine-skip-end-support
          fetch-depth: 0

      - name: Update mine support documentation
        shell: python
        run: |
          from pathlib import Path

          docs = Path('docs/mine-worker.md')
          text = docs.read_text()
          old = ('Stützen stehen zunächst alle 4 Tunnelblöcke. Ein 8-Blöcke-Segment erhält daher einen Rahmen nach Block 4 und einen am Segmentende nach Block 8. '
                 'Sobald eine Stütze erstmals fällig ist und die native Prefab-Platzierung erfolgreich angestoßen wurde, gilt dieser Setzvorgang logisch als erledigt. '
                 'Wird die Stütze später vom Spieler oder von einem NPC entfernt, setzt Civ sie nicht automatisch erneut.\n')
          new = ('Stützen stehen vorerst alle 4 Tunnelblöcke, jedoch nicht direkt am Segmentende. Ein 8-Blöcke-Segment erhält daher aktuell nur den Rahmen nach Block 4; '
                 'der frühere Rahmen nach Block 8 wird ausgelassen, damit der Übergangsbereich für gerade Fortsetzungen und insbesondere Links-/Rechtskurven frei bleibt. '
                 'Spezielle Stützkonstruktionen für Kurven und Kreuzungen sind noch nicht umgesetzt. Sobald eine Stütze erstmals fällig ist und die native Prefab-Platzierung erfolgreich angestoßen wurde, '
                 'gilt dieser Setzvorgang logisch als erledigt. Wird die Stütze später vom Spieler oder von einem NPC entfernt, setzt Civ sie nicht automatisch erneut.\n')
          if old not in text:
              raise SystemExit('mine-worker support paragraph not found')
          docs.write_text(text.replace(old, new, 1))
          Path('.github/workflows/patch-mine-support-docs.yml').unlink()

      - name: Commit docs patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document open mine segment junction"
          git push origin HEAD:fix/mine-skip-end-support
